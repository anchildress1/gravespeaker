pre-commit:
  parallel: false
  commands:
    format:
      glob: '*.{ts,js,svelte,md,json,yaml,yml,css,html}'
      run: make format-files FILES="{staged_files}"
      stage_fixed: true
    lint:
      run: make lint
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}
    scan-secrets:
      run: make secret-scan

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: make typecheck
    unit-tests:
      run: make test
    e2e:
      run: make e2e
    perf:
      run: make perf
