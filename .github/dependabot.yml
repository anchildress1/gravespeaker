# Two ecosystems, one grouped PR each, schedules staggered so they rarely overlap.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      gha:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      pkg:
        patterns:
          - '*'
