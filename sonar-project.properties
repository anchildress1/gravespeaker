sonar.projectKey=anchildress1_gravespeaker
sonar.organization=anchildress1

sonar.sources=src
# Test code is not analyzed: it is neither a source nor registered as a test.
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e.ts,static/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The SSRF deny-list in pages.ts is a list of ranges to refuse, not endpoints to call.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=src/lib/server/pages.ts
